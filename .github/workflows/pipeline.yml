name: Core Pipeline

on:
  push:
    branches:
      - main

jobs:
  run-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run signal decay
        run: python core/signal_decay_engine.py